name: Auto Build Blocklist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Bắt buộc để cấp quyền push file lên repo

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Build Script
        run: python build.py

      - name: Commit & Push File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt
          # Kiểm tra nếu có thay đổi mới commit để tránh lỗi "nothing to commit"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update blocklist" && git push)
